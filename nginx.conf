# Nginx Slim Configuration for ERP System
# This file is intended to be included in an existing Nginx configuration setup.

# Backend API and Admin
upstream backend_server {
    server 127.0.0.1:8002;
}

# Frontend (Next.js)
upstream frontend_server {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    server_name localhost;

    # Max upload size
    client_max_body_size 20M;

    # Backend API
    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Admin
    location /admin/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Static Files (Optional: Direct Serve for better performance)
    # To use this, you must mount the backend's staticfiles folder to your host 
    # and update the path below to your absolute project path.
    # location /static/ {
    #     alias /var/www/ecom/staticfiles/;
    # }

    # Backend Media Files (Optional: User uploads)
    # location /media/ {
    #     alias /absolute/path/to/your/ERP/backend/media/;
    # }

    # Frontend (Next.js Standalone)
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
